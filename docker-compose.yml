version: '3.8'

services:
  # PostgreSQL Database (Supabase Core)
  postgres:
    image: supabase/postgres:15.1.0.117
    container_name: teknofest-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: teknofest2025secret
      POSTGRES_USER: postgres
      POSTGRES_DB: teknofest_telco
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./SUPABASE_SETUP.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - teknofest-network

  # PostgREST (REST API for PostgreSQL)
  postgrest:
    image: postgrest/postgrest:v10.1.1
    container_name: teknofest-postgrest
    ports:
      - "3001:3000"
    environment:
      PGRST_DB_URI: postgres://postgres:teknofest2025secret@postgres:5432/teknofest_telco
      PGRST_DB_ANON_ROLE: postgres
      PGRST_DB_SCHEMAS: public
      PGRST_SERVER_PROXY_URI: http://localhost:3001
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - teknofest-network

  # pgAdmin (Optional - Visual Database Management)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: teknofest-pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@teknofest.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - teknofest-network

  # Redis (For caching and real-time)
  redis:
    image: redis:7-alpine
    container_name: teknofest-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - teknofest-network

  # Python App Container (Optional - Run our system in Docker)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: teknofest-app
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: teknofest_telco
      DB_USER: postgres
      DB_PASSWORD: teknofest2025secret
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/app
    working_dir: /app
    command: python3 LOCAL_TELCO_TOOLS.py
    networks:
      - teknofest-network

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  redis_data:
    driver: local

networks:
  teknofest-network:
    driver: bridge